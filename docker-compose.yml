services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000" 
    environment:
      - JWT_SECRET=devops_portfolio_secret_key
      - STRIPE_SECRET_KEY=sample_stripe_key_placeholder
      - MONGO_URI=mongodb://db:27017/quickbite
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" 
    depends_on:
      - backend

  admin:
    build:
      context: ./Admin
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend

  db:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodata:

